name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  console:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse an unsigned legal review
        run: |
          if grep -q 'Status: pending counsel' LEGAL_REVIEW.md; then
            echo "LEGAL_REVIEW.md is still pending counsel. Do not publish this tag."
            exit 1
          fi
          if git remote -v | grep -q 'gitlab.com/apito.io/engine'; then
            echo "This workflow must build the public console tree."
            exit 1
          fi
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm build
      - name: License manifest
        run: |
          availability=$(git log -1 --format=%cs)
          scripts/release-license-manifest.sh "${GITHUB_REF_NAME}" "$availability" release-manifest.json
      - name: Publish console build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -C dist -czf console-dist.tar.gz .
          gh release upload "${GITHUB_REF_NAME}" console-dist.tar.gz --clobber
      - name: Tell Studio this console build finished
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/apito-io/studio/dispatches --input - <<EOF
          {"event_type":"component_ready","client_payload":{"component":"console","ref":"${GITHUB_REF_NAME}"}}
          EOF
